<div class="topic-panel">
  <p class="topic-panel__eyebrow">Explore</p>
  <h2>Topics</h2>
  <p>Browse practical guides by subject.</p>

  {% if sections %}
    <ul class="topic-panel__list">
      {% for section in sections|slice:':6' %}
        <li><a href="{{ section.get_absolute_url }}">{{ section }}</a></li>
      {% endfor %}
    </ul>
  {% endif %}

  <a class="topic-panel__all" href="{% url 'en_legin_abroad:en_sections' %}">
    View all topics <span aria-hidden="true">→</span>
  </a>
</div>
