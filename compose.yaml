services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${DOCKER_ENV_FILE:-.env.docker}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - static_data:/app/static
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  static_data:
