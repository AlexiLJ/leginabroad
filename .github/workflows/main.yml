name: Deploy Docker

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        id: configure_ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for secret_name in \
            SSH_PRIVATE_KEY \
            SSH_HOST \
            SSH_USER \
            SSH_KNOWN_HOSTS
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::${secret_name} is empty or unavailable to this job"
              exit 1
            fi
          done

          ssh_host="$(printf '%s' "$SSH_HOST" | tr -d '\r\n')"
          ssh_user="$(printf '%s' "$SSH_USER" | tr -d '\r\n')"

          if [[ ! "$ssh_host" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::SSH_HOST must contain only a hostname or IPv4 address, without quotes or a URL scheme"
            exit 1
          fi

          if [[ ! "$ssh_user" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::SSH_USER is not a valid SSH username"
            exit 1
          fi

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          host_key="$(
            printf '%s\n' "$SSH_KNOWN_HOSTS" |
              tr -d '\r' |
              awk '
                $1 == "ssh-ed25519" { print $1 " " $2; exit }
                $2 == "ssh-ed25519" { print $2 " " $3; exit }
              '
          )"

          if [[ -z "$host_key" ]]; then
            echo "::error::SSH_KNOWN_HOSTS does not contain an ED25519 host key"
            exit 1
          fi

          printf '%s %s\n' "$ssh_host" "$host_key" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          if ! ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "::error::SSH_KNOWN_HOSTS contains a truncated or malformed ED25519 key"
            exit 1
          fi

          if ! ssh-keygen -F "$ssh_host" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::Could not create a known-host entry for SSH_HOST"
            exit 1
          fi

          cat > ~/.ssh/config <<EOF
          Host target
            HostName $ssh_host
            User $ssh_user
            IdentityFile ~/.ssh/id_rsa
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            LogLevel ERROR
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy exact revision
        run: |
          ssh target "cd ~/leginabroad \
            && git pull --ff-only \
            && test \"\$(git rev-parse HEAD)\" = \"$GITHUB_SHA\" \
            && bash scripts/deploy-container.sh"

      - name: Verify public website
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            https://leginabroad.com/healthz/

          curl \
            --fail \
            --show-error \
            --silent \
            --head \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            https://leginabroad.com/

      - name: Show diagnostics after failure
        if: ${{ failure() && steps.configure_ssh.outcome == 'success' }}
        continue-on-error: true
        run: |
          ssh target 'cd ~/leginabroad \
            && docker compose \
              --env-file .env.docker \
              -f compose.yaml \
              -f compose.production.yaml \
              ps \
            && docker compose \
              --env-file .env.docker \
              -f compose.yaml \
              -f compose.production.yaml \
              logs --tail=100 web'
