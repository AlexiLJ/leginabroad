services:
  web:
    volumes:
      # Keep the existing host static directory available to Nginx while the
      # application runs in Docker. It must be writable by UID/GID 10001.
      - ./static:/app/static
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
